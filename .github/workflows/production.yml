# PRODUCTION deploy of the app + API Worker (patholo-zzee-app), only from main. Runs by itself after "Build, test and deploy to
# GitHub Pages" succeeds for a push to main (so the -app link gets every change that passed the tests, the same commit), and can
# still be run by hand (workflow_dispatch). A failed or cancelled test run deploys nothing.
name: Deploy production
on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ['Build, test and deploy to GitHub Pages']
    types: [completed]
    branches: [main]
permissions: { contents: read }
concurrency: { group: production, cancel-in-progress: false }
jobs:
  production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LEAK_KEY: ${{ secrets.LEAK_KEY }}
      WRANGLER_SEND_METRICS: 'false'
      DB: patholo-zzee-prod
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }  # the commit that passed the tests
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Restore private sources, build, assemble the site (gated index + free sample only)
        env: { CONTENT_KEY: '${{ secrets.CONTENT_KEY }}' }
        run: |
          sh tools/restore_private.sh
          mkdir _site && cp -r index.html annot welcome.js zz-store.js sw.js manifest.json icons fonts terms.html privacy.html refund.html _site/
          mkdir _site/textbook && cp textbook/index.json textbook/ch01.html _site/textbook/
          cd worker && npm ci --no-audit --no-fund
      - name: D1 (create if missing), migrations, chunks
        working-directory: worker
        run: |
          w() { npx wrangler "$@" > /tmp/w.out 2> /tmp/w.err || { tail -n 8 /tmp/w.err /tmp/w.out | grep -v "^==>" | sed "s/^/::error::/"; return 1; }; }
          w d1 list --json; ID=$(python3 -c "import json;print(next((d['uuid'] for d in json.load(open('/tmp/w.out')) if d['name']=='$DB'),''))")
          if [ -z "$ID" ]; then w d1 create "$DB"; w d1 list --json; ID=$(python3 -c "import json;print(next(d['uuid'] for d in json.load(open('/tmp/w.out')) if d['name']=='$DB'))"); fi
          sed -e "s/__D1_ID__/$ID/" wrangler.prod.jsonc > wrangler.run.jsonc
          w d1 migrations apply "$DB" --remote -c wrangler.run.jsonc
          python3 ../tools/chunks_sql.py ../content/manifest.json ../private-chunks /tmp/chunks.sql
          w d1 execute "$DB" --remote --yes -c wrangler.run.jsonc --file /tmp/chunks.sql; rm -f /tmp/chunks.sql
      - name: Deploy (app + API on one origin)
        working-directory: worker
        run: |
          w() { npx wrangler "$@" > /tmp/w.out 2> /tmp/w.err || { tail -n 8 /tmp/w.err /tmp/w.out | grep -v "^==>" | sed "s/^/::error::/"; return 1; }; }
          w deploy -c wrangler.run.jsonc --assets ../_site
          echo "URL=https://patholo-zzee-app.muhtasimrp74.workers.dev" >> "$GITHUB_ENV"
      - name: Worker secrets (JWT_SECRET generated once; ADMIN_KEY derived from LEAK_KEY)
        working-directory: worker
        run: |
          python3 - > /tmp/s.json <<'PY'
          import json, os, secrets, subprocess, hmac, hashlib
          have = subprocess.run(['npx', 'wrangler', 'secret', 'list', '-c', 'wrangler.run.jsonc', '--format', 'json'], capture_output=True, text=True).stdout
          names = {s['name'] for s in json.loads(have or '[]')}
          out = {'ADMIN_KEY': hmac.new(os.environ['LEAK_KEY'].encode(), b'patholo-admin-v1', hashlib.sha256).hexdigest()}
          if 'JWT_SECRET' not in names: out['JWT_SECRET'] = secrets.token_urlsafe(48)
          print(json.dumps(out))
          PY
          npx wrangler secret bulk /tmp/s.json -c wrangler.run.jsonc > /dev/null 2> /tmp/w.err || { tail -n 5 /tmp/w.err | sed "s/^/::error::/"; exit 1; }
          rm -f /tmp/s.json
      - name: Smoke tests
        run: |
          sleep 10; c() { curl -s -o /dev/null -w '%{http_code}' "$URL$1"; }
          A=$(c /api/chunks/q-02.json); F=$(c /api/chunks/q-01.json); U=$(c /api/chunks/q-99.json); P=$(c /); G=$(c /api/bundles)
          echo "::notice::PRODUCTION $URL: no session $A (401), free $F (200), unknown $U (404), app $P (200), prices $G (200)"
          [ "$A" = 401 ] && [ "$F" = 200 ] && [ "$U" = 404 ] && [ "$P" = 200 ] && [ "$G" = 200 ]
